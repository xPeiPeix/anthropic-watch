server:
  host: 0.0.0.0
  # 8080 falls inside a Windows excluded port range (Hyper-V/WSL reservation),
  # so it cannot be bound on this machine; 9080 is outside all excluded ranges.
  # The two custom-api widgets hard-code this port in their URL; keep in sync.
  port: 9080
  # Snapshot written by scripts/anthropic_quota_watch.py is served from here.
  assets-path: ./assets

theme:
  background-color: 225 14 10
  primary-color: 157 47 65
  positive-color: 115 54 76
  negative-color: 0 90 60
  contrast-multiplier: 1.1
  text-saturation-multiplier: 0.5
  # Custom widget styling (quota meters, announcement cards). The file is
  # whitelisted in .gitignore; assets-path serves it at /assets/.
  custom-css-file: /assets/anthropic-watch.css
  presets:
    anthropic-clay:
      background-color: 20 14 10
      primary-color: 14 60 62
      positive-color: 140 45 52
      negative-color: 2 75 60
      contrast-multiplier: 1.15
    high-contrast:
      background-color: 222 16 7
      primary-color: 210 78 72
      positive-color: 150 52 55
      negative-color: 0 80 66
      contrast-multiplier: 1.35

branding:
  logo-text: Anthropic Watch
  favicon-url: https://www.anthropic.com/favicon.ico

pages:
  # ==================== Page 1: 总览 ====================
  - name: 总览
    slug: ""
    columns:
      # ---------- Left Column (small) ----------
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Asia/Shanghai
                label: Beijing
              - timezone: America/Los_Angeles
                label: SF (Anthropic HQ)

          - type: monitor
            title: Anthropic Services
            cache: 1m
            sites:
              - title: Claude.ai
                url: https://claude.ai
                icon: si:anthropic
                alt-status-codes:
                  - 403
              - title: Claude API
                url: https://api.anthropic.com
                icon: si:anthropic
                check-url: https://status.anthropic.com/api/v2/status.json
              - title: Platform
                url: https://platform.claude.com
                icon: si:anthropic

          - type: rss
            title: API Status
            style: vertical-list
            limit: 8
            collapse-after: 5
            cache: 5m
            feeds:
              - url: https://status.anthropic.com/history.atom
                title: Claude Status

      # ---------- Right Column (full) ----------
      - size: full
        widgets:
          - type: split-column
            max-columns: 2
            widgets:
              - type: custom-api
                title: Claude 额度重置
                cache: 5m
                url: http://localhost:9080/assets/anthropic_quota.json
                template: |
                  {{ if .JSON.Bool "limits.ok" }}
                    <div class="aw-quota">
                      {{ $f := .JSON.Int "limits.five_hour.utilization" }}
                      <div class="aw-row">
                        <div class="aw-row-head">
                          <span class="color-highlight">5 小时窗口</span>
                          <span class="aw-pct">已用 {{ $f }}%</span>
                        </div>
                        <div class="aw-meter">
                          <div class="aw-meter-fill {{ if ge $f 90 }}aw-crit{{ else if ge $f 70 }}aw-warn{{ else }}aw-ok{{ end }}" style="width: {{ $f }}%"></div>
                        </div>
                        {{ $r := .JSON.String "limits.five_hour.resets_at" }}
                        {{ if $r }}
                        <div class="aw-sub color-subdue">额度重置 <span {{ $r | parseTime "rfc3339" | toRelativeTime }}></span></div>
                        {{ else }}
                        <div class="aw-sub color-subdue">额度重置 <span class="color-base">未知（本周期无用量）</span></div>
                        {{ end }}
                      </div>

                      {{ $w := .JSON.Int "limits.seven_day.utilization" }}
                      <div class="aw-row">
                        <div class="aw-row-head">
                          <span class="color-highlight">7 天（周）窗口</span>
                          <span class="aw-pct">已用 {{ $w }}%</span>
                        </div>
                        <div class="aw-meter">
                          <div class="aw-meter-fill {{ if ge $w 90 }}aw-crit{{ else if ge $w 70 }}aw-warn{{ else }}aw-ok{{ end }}" style="width: {{ $w }}%"></div>
                        </div>
                        {{ $rw := .JSON.String "limits.seven_day.resets_at" }}
                        {{ if $rw }}
                        <div class="aw-sub color-subdue">额度重置 <span {{ $rw | parseTime "rfc3339" | toRelativeTime }}></span></div>
                        {{ else }}
                        <div class="aw-sub color-subdue">额度重置 <span class="color-base">未知（本周期无用量）</span></div>
                        {{ end }}
                      </div>

                      {{ if .JSON.Exists "limits.seven_day_opus.utilization" }}
                      {{ $o := .JSON.Int "limits.seven_day_opus.utilization" }}
                      <div class="aw-row">
                        <div class="aw-row-head">
                          <span class="color-highlight">Opus 周窗口</span>
                          <span class="aw-pct">已用 {{ $o }}%</span>
                        </div>
                        <div class="aw-meter">
                          <div class="aw-meter-fill {{ if ge $o 90 }}aw-crit{{ else if ge $o 70 }}aw-warn{{ else }}aw-ok{{ end }}" style="width: {{ $o }}%"></div>
                        </div>
                        {{ $ro := .JSON.String "limits.seven_day_opus.resets_at" }}
                        {{ if $ro }}
                        <div class="aw-sub color-subdue">额度重置 <span {{ $ro | parseTime "rfc3339" | toRelativeTime }}></span></div>
                        {{ end }}
                      </div>
                      {{ end }}

                      <div class="aw-updated color-subdue">数据更新 <span {{ .JSON.String "updated_at" | parseTime "rfc3339" | toRelativeTime }}></span></div>
                    </div>
                  {{ else }}
                    <p class="color-negative">额度数据暂不可用（{{ .JSON.String "limits.error" }}）</p>
                    {{ if .JSON.Exists "limits.hint" }}
                    <p class="size-h6 color-subdue">{{ .JSON.String "limits.hint" }}</p>
                    {{ end }}
                  {{ end }}

              - type: custom-api
                title: 额度 / 提额公告
                cache: 10m
                url: http://localhost:9080/assets/anthropic_quota.json
                template: |
                  {{ if .JSON.Bool "announcements.ok" }}
                    {{ $items := .JSON.Array "announcements.items" }}
                    {{ if eq (len $items) 0 }}
                      <p class="color-subdue">近 14 天暂无额度相关公告（已扫描 {{ .JSON.Int "announcements.scanned" }} 条官方条目，AI 网关语义判定）</p>
                    {{ else }}
                      <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                        {{ range $items }}
                          <li class="aw-card">
                            <div class="aw-card-top">
                              <span class="aw-badge">{{ .String "change_type" }}</span>
                              {{ if .Bool "is_new" }}<span class="aw-badge aw-badge-new">NEW</span>{{ end }}
                              <span class="aw-card-src color-subdue">{{ .String "source" }}</span>
                            </div>
                            <a class="size-h4 color-highlight block text-truncate" href="{{ .String "link" }}" target="_blank" rel="noreferrer">{{ .String "title" }}</a>
                            <div class="size-h6 color-paragraph aw-card-sum">{{ .String "summary_zh" }}</div>
                          </li>
                        {{ end }}
                      </ul>
                    {{ end }}
                  {{ else }}
                    <p class="color-negative">公告扫描暂不可用（{{ .JSON.String "announcements.error" }}）</p>
                  {{ end }}

          - type: group
            widgets:
              - type: rss
                title: News & Announcements
                style: detailed-list
                limit: 10
                collapse-after: 6
                cache: 30m
                feeds:
                  - url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
                    title: Anthropic News

              - type: hacker-news
                title: Hacker News · Anthropic
                limit: 10
                collapse-after: 5

  # ==================== Page 2: 版本 & 发布 ====================
  - name: 版本 & 发布
    width: wide
    columns:
      - size: full
        widgets:
          - type: split-column
            max-columns: 3
            widgets:
              - type: releases
                title: 官方仓库 Releases
                cache: 1h
                repositories:
                  - anthropics/claude-code
                  - anthropics/skills
                  - anthropics/claude-plugins-official
                  - anthropics/claude-code-action
                  - anthropics/claude-agent-sdk-python
                  - anthropics/claude-agent-sdk-typescript

              - type: releases
                title: SDK Releases
                cache: 1h
                repositories:
                  - anthropics/anthropic-sdk-python
                  - anthropics/anthropic-sdk-typescript
                  - anthropics/anthropic-sdk-go

              - type: releases
                title: 上游 Glance（fork 同步）
                cache: 1h
                repositories:
                  - glanceapp/glance

          - type: split-column
            max-columns: 2
            widgets:
              - type: repository
                title: anthropics/claude-code
                cache: 3h
                repository: anthropics/claude-code
                pull-requests-limit: 5
                issues-limit: 3
                commits-limit: 5

              - type: rss
                title: Claude Code Changelog
                style: vertical-list
                limit: 20
                collapse-after: 10
                cache: 1h
                feeds:
                  # Olshansk changelog mirror is dead (frozen at v2.1.114 with a
                  # "no longer maintained" notice); GitHub's own releases atom is
                  # live and carries real <updated> dates so relative time works.
                  - url: https://github.com/anthropics/claude-code/releases.atom
                    title: Claude Code Updates

  # ==================== Page 3: 研究 & 工程 ====================
  - name: 研究 & 工程
    columns:
      - size: full
        widgets:
          - type: split-column
            max-columns: 2
            widgets:
              - type: rss
                title: Anthropic Research
                style: vertical-list
                limit: 20
                collapse-after: 10
                cache: 1h
                feeds:
                  - url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_research.xml
                    title: Research Papers

              - type: rss
                title: Engineering Blog
                style: detailed-list
                limit: 15
                collapse-after: 8
                cache: 1h
                feeds:
                  - url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml
                    title: Engineering

          - type: split-column
            max-columns: 2
            widgets:
              - type: rss
                title: Red Teaming
                style: vertical-list
                limit: 10
                collapse-after: 5
                cache: 1h
                feeds:
                  - url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_red.xml
                    title: Red Team

              - type: rss
                title: Anthropic News（全量）
                style: detailed-list
                limit: 15
                collapse-after: 8
                cache: 30m
                feeds:
                  - url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
                    title: Anthropic News

  # ==================== Page 4: 生态 & 舆情 ====================
  - name: 生态 & 舆情
    width: wide
    columns:
      - size: full
        widgets:
          - type: split-column
            max-columns: 3
            widgets:
              - type: hacker-news
                title: Hacker News · AI
                limit: 15
                collapse-after: 8

              # Reddit's JSON API (used by the `reddit` widget) returns 403 for
              # unauthenticated requests; the public .rss feed still serves 200
              # without app-auth credentials. Use rss to avoid a broken widget
              # and to keep a Reddit app secret out of this public repo.
              # preserve-order keeps Reddit's hot ranking: the .rss feed is
              # already hot-ordered and widget-rss.go re-sorts by date unless
              # preserve-order is set, which would drop the original sort: hot.
              # The browser User-Agent matches the old reddit widget
              # (widget-reddit.go:171); the rss default Glance/<ver> crawler UA
              # can itself be 403'd by Reddit's UA-based filtering.
              - type: rss
                title: r/anthropic
                style: vertical-list
                preserve-order: true
                limit: 12
                collapse-after: 6
                cache: 30m
                feeds:
                  - url: https://www.reddit.com/r/anthropic/.rss
                    title: r/anthropic
                    headers:
                      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:137.0) Gecko/20100101 Firefox/137.0

              - type: rss
                title: r/ClaudeAI
                style: vertical-list
                preserve-order: true
                limit: 12
                collapse-after: 6
                cache: 30m
                feeds:
                  - url: https://www.reddit.com/r/ClaudeAI/.rss
                    title: r/ClaudeAI
                    headers:
                      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:137.0) Gecko/20100101 Firefox/137.0

          - type: split-column
            max-columns: 2
            widgets:
              - type: rss
                title: AI Tech News
                style: horizontal-cards
                limit: 20
                cache: 30m
                feeds:
                  - url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
                    title: The Verge AI
                    limit: 5
                  - url: https://techcrunch.com/category/artificial-intelligence/feed/
                    title: TechCrunch AI
                    limit: 5
                  - url: https://feeds.arstechnica.com/arstechnica/index
                    title: Ars Technica
                    limit: 5

              - type: videos
                title: Anthropic YouTube
                style: grid-cards
                channels:
                  - UCrDwWp7EBBv4NwvScIpBDOA
                limit: 6
                cache: 3h
